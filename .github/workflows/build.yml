name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # This creates a package.json automatically if it's missing from your repo
    - name: Initialize NPM & Install Capacitor
      run: |
        if [ ! -f package.json ]; then
          npm init -y
        fi
        npm install @capacitor/core @capacitor/cli @capacitor/ios

    # Generates a clean config and web assets folder
    - name: Initialize and Sync Project
      run: |
        mkdir -p www
        if [ ! -f www/index.html ]; then
          echo "<html><body><h1>Loading...</h1></body></html>" > www/index.html
        fi
        
        # Creates a fresh configuration pointing to your target website
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.mywebsite.app",
          "appName": "My Web App",
          "webDir": "www",
          "server": {
            "url": "https://apple.com"
          }
        }
        EOF

        npx cap add ios
        npx cap sync ios

    - name: Build Unsigned IPA
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace \
                   -scheme App \
                   -configuration Release \
                   -sdk iphoneos \
                   -allowProvisioningUpdates \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   clean build
                   
    - name: Package into .ipa
      run: |
        mkdir -p build/Payload
        cp -r ios/App/build/Release-iphoneos/App.app build/Payload/
        cd build
        zip -r MyWebApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-unsigned-ipa
        path: build/MyWebApp.ipa
        
